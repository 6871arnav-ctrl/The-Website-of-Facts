<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWoF — Fact Upload Center</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b1020;color:#eef2ff}h1{margin-bottom:6px}.muted{color:#aab4d0}.card{background:#121a30;border:1px solid #293452;border-radius:16px;padding:22px;margin:18px 0}button{padding:11px 16px;border:0;border-radius:10px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#111}.secondary{background:#26324f;color:#fff}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;margin-bottom:14px;padding:10px;border-radius:9px;border:1px solid #354263;background:#0d1427;color:#fff}textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}#status{white-space:pre-wrap}</style></head><body><h1>TWoF Fact Upload Center</h1><p class="muted">Add facts without editing website code. This local tool loads and exports the TWoF fact database and never stores GitHub credentials.</p><div class="card"><h2>1. Load your current database</h2><input id="file" type="file" accept=".json,application/json"><button class="secondary" onclick="loadFile()">Load facts.json</button></div><div class="card"><h2>2. Add a fact</h2><div class="row"><div><label>Title</label><input id="title"></div><div><label>Category</label><select id="category"><option value="space">Space Science & Astronomy</option><option value="history">History & General Knowledge</option><option value="physics">Physics</option><option value="biology">Biology</option><option value="mathematics">Mathematics</option><option value="chemistry">Chemistry</option></select></div></div><label>Topic</label><input id="topic"><label>Tags (comma-separated)</label><input id="tags"><label>Short summary</label><textarea id="summary"></textarea><label>Why is it surprising?</label><textarea id="whySurprising"></textarea><label>Explanation</label><textarea id="explanation"></textarea><label>Deep dive</label><textarea id="deepDive"></textarea><div class="row"><div><label>Source title</label><input id="sourceTitle"></div><div><label>Source URL</label><input id="sourceUrl" type="url"></div></div><button class="primary" onclick="addFact()">Add Fact</button></div><div class="card"><h2>3. Export the database</h2><p id="count" class="muted">0 facts loaded</p><button class="primary" onclick="downloadJson()">Export facts.json</button><p id="status" class="muted"></p></div><script>let db={version:1,facts:[]};const ids=['title','topic','tags','summary','whySurprising','explanation','deepDive','sourceTitle','sourceUrl'];function loadFile(){const f=document.getElementById('file').files[0];if(!f){status('Choose your current facts.json first.');return}const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.facts))throw new Error('Invalid facts.json: facts must be an array.');db=x;refresh();status('Loaded successfully.')}catch(e){status(e.message)}};r.readAsText(f)}function val(id){return document.getElementById(id).value.trim()}function addFact(){const fact={id:'fact-'+Date.now(),title:val('title'),category:val('category'),topic:val('topic'),tags:val('tags').split(',').map(x=>x.trim()).filter(Boolean),summary:val('summary'),whySurprising:val('whySurprising'),explanation:val('explanation'),deepDive:val('deepDive'),sources:[{title:val('sourceTitle'),url:val('sourceUrl')}]};if(!fact.title||!fact.summary||!fact.explanation||!fact.sourceTitle||!fact.sources[0].url){status('Please fill the title, summary, explanation, source title, and source URL.');return}db.facts.push(fact);refresh();status('Fact added. Export facts.json when ready.');ids.forEach(id=>document.getElementById(id).value='')}function refresh(){document.getElementById('count').textContent=db.facts.length+' fact'+(db.facts.length===1?'':'s')+' loaded'}function downloadJson(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='facts.json';a.click();status('facts.json exported. Replace facts.json with this file before publishing.')}function status(x){document.getElementById('status').textContent=x}refresh();</script></body></html>
